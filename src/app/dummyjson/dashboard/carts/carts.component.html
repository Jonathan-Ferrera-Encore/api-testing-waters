<div>
    @if (isLoadingCarts || isRateLimitReached) {
        <div>
            @if (isLoadingCarts) {
                <mat-spinner></mat-spinner>
            }
            @if (isRateLimitReached) {
                <div>
                    No data found.
                </div>
            }
        </div>
    }
</div>

<div class="carts-container">
    <table mat-table [dataSource]="cartsDataSource" class="cart-table" matSort matSortActive="id" matSortDisableClear matSortDirection="asc">
        <ng-container matColumnDef="id">
            <th mat-header-cell *matHeaderCellDef>#</th>
            <td mat-cell *matCellDef="let row">{{row.id}}</td>
        </ng-container>

        <ng-container matColumnDef="total">
            <th mat-header-cell *matHeaderCellDef>Total</th>
            <td mat-cell *matCellDef="let row">{{row.total}}</td>
        </ng-container>

        <ng-container matColumnDef="discountedTotal">
            <th mat-header-cell *matHeaderCellDef>Discounted Total</th>
            <td mat-cell *matCellDef="let row">{{row.discountedTotal}}</td>
        </ng-container>

        <ng-container matColumnDef="totalProducts">
            <th mat-header-cell *matHeaderCellDef>Total Products</th>
            <td mat-cell *matCellDef="let row">{{row.totalProducts}}</td>
        </ng-container>

        <ng-container matColumnDef="totalQuantity">
            <th mat-header-cell *matHeaderCellDef>Total Quantity</th>
            <td mat-cell *matCellDef="let row">{{row.totalQuantity}}</td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
</div>

<mat-paginator [length]="resultsLength" [pageSize]="30" aria-label="Select page of GitHub search results"></mat-paginator>
